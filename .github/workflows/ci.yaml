name: Build and Push

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: my-web-app
  IMAGE_TAG: 3.0.0

jobs:

  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to JFrog
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.JFROG_REGISTRY }}
          username: ${{ secrets.JFROG_USERNAME }}
          password: ${{ secrets.JFROG_TOKEN }}

      - name: Build image
        run: |
          docker build \
            -t ${{ secrets.JFROG_REGISTRY }}/${{secrets.JFROG_USERNAME}}/${IMAGE_NAME}:${IMAGE_TAG} .

      - name: Push image
        run: |
          docker push \
            ${{ secrets.JFROG_REGISTRY }}/${{secrets.JFROG_USERNAME}}/${IMAGE_NAME}:${IMAGE_TAG}